model = "gpt-6-sol"
model_provider = "cpa"
model_reasoning_effort = "medium"
model_context_window = 272000
developer_instructions = """
Keep every commentary update to one short sentence.
State only the immediate action being taken or the concrete result found.
Do not add acknowledgements, rationale, planning ceremony, or conversational framing.
"""

[features]
hooks = true
multi_agent_v2 = true

[agents]
default_subagent_model = "ocg/muse-spark-1.3-contributor"
default_subagent_reasoning_effort = "max"

[agents.sol]
description = "Strong but expensive subagent, well rounded in all areas except for UI/UX. Opt-in only."
config_file = "subagents/sol.toml"

[agents.terra]
description = "Code review focused subagent."
config_file = "subagents/terra.toml"

[agents.luna]
description = "Secondary workhorse subagent when primary is not available."
config_file = "subagents/luna.toml"

[agents.luna-fast]
description = "Secondary workhorse subagent when primary is not available (Fast mode)."
config_file = "subagents/luna-fast.toml"

[agents.muse13]
description = "Primary work horse subagent."
config_file = "subagents/muse13.toml"

[agents.glm53f]
description = "UI/UX focused, general-purpose subagent."
config_file = "subagents/glm53f.toml"

[model_providers.cpa]
name = "CLI Proxy API"
base_url = "https://cpa1.p.si14.space/v1"
wire_api = "responses"
env_key = "CPA_API_KEY"
requires_openai_auth = false
http_headers = { "x-opencode-session" = "codex" }
