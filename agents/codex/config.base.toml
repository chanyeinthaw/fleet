model = "gpt-6.1-sol"
model_provider = "cpa"
model_reasoning_effort = "medium"
model_context_window = 272000
developer_instructions = """
Keep every commentary update to one short sentence.
State only the immediate action being taken or the concrete result found.
Do not add acknowledgements, rationale, planning ceremony, or conversational framing.
"""

[features]
hooks = true
multi_agent_v2 = true

[agents.explorer]
description = "Answer focused codebase questions by locating relevant code and tracing behavior."
config_file = "subagents/explorer.toml"

[agents.reviewer]
description = "Review code changes for concrete bugs, regressions, and missing safeguards."
config_file = "subagents/reviewer.toml"

[agents.worker]
description = "Implement a scoped code change and verify the result."
config_file = "subagents/worker.toml"

[agents.uiux]
description = "Design and implement UI/UX changes, or audit interfaces and user flows for usability and accessibility."
config_file = "subagents/uiux.toml"

[model_providers.cpa]
name = "CLI Proxy API"
base_url = "https://cpa1.p.si14.space/v1"
wire_api = "responses"
env_key = "CPA_API_KEY"
requires_openai_auth = false
