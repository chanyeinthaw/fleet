services:
  blob-1:
    container_name: blob-1
    image: fleet/blob-1:0.0.0-latest.20261122.0313
    build:
      context: image
    restart: unless-stopped
    depends_on:
      docker-in-docker:
        condition: service_healthy
    networks: [default, docker-in-docker]
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      CPA1_KEY: ${BLOB_1_CPA1_KEY:?required by fnox}
      BLOB_1_APP_KEY: ${BLOB_1_APP_KEY:?required by fnox}
      TAILSCALE_AUTH_KEY: ${BLOB_1_TAILSCALE_AUTH_KEY:-}
      TAILSCALE_HOSTNAME: blob-1
      BLOB_1_PUBLIC_URL: https://blob-1.p.si14.space
    ports:
      - "127.0.0.1:3787:7878"
    volumes:
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/blob-1/home:/home/blob/.blob-1
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/blob-1/gh:/home/blob/.config/gh
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/blob-1/ssh:/home/blob/.ssh
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/blob-1/ssh-host:/var/lib/blob-1-ssh
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/blob-1/tailscale:/var/lib/tailscale
      - docker-in-docker-certs:/certs/client:ro
    healthcheck:
      test: [CMD, /usr/local/bin/blob-1-healthcheck]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
