[unix_http_server]
file=/home/blob/.blob-1/run/supervisor.sock
chmod=0700
chown=blob:blob

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/home/blob/.blob-1/run/supervisord.pid
childlogdir=/home/blob/.blob-1/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/blob/.blob-1/run/supervisor.sock

[program:tailscaled]
command=/usr/sbin/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock --tun=userspace-networking
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/home/blob/.blob-1/logs/tailscaled.stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/home/blob/.blob-1/logs/tailscaled.stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:tailscale-up]
command=/usr/local/bin/blob-1-tailscale-up
autostart=true
autorestart=false
startsecs=0
priority=20
stdout_logfile=/home/blob/.blob-1/logs/tailscale-up.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/home/blob/.blob-1/logs/tailscale-up.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startsecs=2
priority=30
stdout_logfile=/home/blob/.blob-1/logs/sshd.stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/home/blob/.blob-1/logs/sshd.stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:blob-1]
command=/usr/local/bin/blob-1-entrypoint
directory=/home/blob
user=blob
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
priority=40
stdout_logfile=/home/blob/.blob-1/logs/blob-1.stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/blob/.blob-1/logs/blob-1.stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HOME="/home/blob",BLOB_1_HOME="/home/blob/.blob-1",XDG_DATA_HOME="/home/blob/.blob-1/data"
