services:
  cpa1-plugin:
    container_name: cpa1-plugin
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    user: "0:0"
    entrypoint: [sh, -euc]
    command:
      - |
        plugin=/data/plugins/opencode-session-v0.1.7.so
        mkdir -p "$$(dirname "$$plugin")"
        curl --fail --location --silent --show-error \
          https://github.com/chanyeinthaw/cpa-opencode-session/releases/download/v0.1.7/opencode-session-v0.1.7.so \
          --output "$$plugin.tmp"
        echo "47f9cd3f3cfceabf1a3ff58a598519a8778e446c3e7ca525839fe0a1d140703e  $$plugin.tmp" | sha256sum -c -
        mv "$$plugin.tmp" "$$plugin"
        rm -f /data/plugins/opencode-session-v0.1.6.so
    volumes:
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/cpa1:/data

  cpa1:
    container_name: cpa1
    image: eceasy/cli-proxy-api:v8.0.4@sha256:72205ea2dff7e3e3ef23b03de4e17b169ff7449c02b12f2924a3d4d3eee68b7d
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cpa1-plugin:
        condition: service_completed_successfully
    environment:
      CLI_PROXY_DB_PASSWORD: ${CPA1_CLI_PROXY_DB_PASSWORD:?required by fnox}
      MANAGEMENT_PASSWORD: ${CPA1_MANAGEMENT_PASSWORD:?required by fnox}
      PGSTORE_DSN: ${CPA1_PGSTORE_DSN:?required by fnox}
      PGSTORE_LOCAL_PATH: /data
    ports:
      - "127.0.0.1:${CPA1_PORT:-8320}:8317"
    volumes:
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/cpa1:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8317
          printf 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 1g
