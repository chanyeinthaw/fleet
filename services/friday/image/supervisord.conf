[unix_http_server]
file=/home/friday/.friday/run/supervisor.sock
chmod=0700
chown=friday:friday

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/home/friday/.friday/run/supervisord.pid
childlogdir=/home/friday/.friday/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/friday/.friday/run/supervisor.sock

[program:tailscaled]
command=/usr/sbin/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock --tun=userspace-networking
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/home/friday/.friday/logs/tailscaled.stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/home/friday/.friday/logs/tailscaled.stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:tailscale-up]
command=/usr/local/bin/friday-tailscale-up
autostart=true
autorestart=false
startsecs=0
priority=20
stdout_logfile=/home/friday/.friday/logs/tailscale-up.stdout.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/home/friday/.friday/logs/tailscale-up.stderr.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startsecs=2
priority=30
stdout_logfile=/home/friday/.friday/logs/sshd.stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/home/friday/.friday/logs/sshd.stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:friday]
command=/usr/local/bin/friday-runtime-entrypoint
directory=/home/friday
user=friday
autostart=true
autorestart=unexpected
startsecs=10
startretries=4
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
priority=40
stdout_logfile=/home/friday/.friday/logs/supervisor-friday.stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/friday/.friday/logs/supervisor-friday.stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HOME="/home/friday",FRIDAY_HOME="/home/friday/.friday"
