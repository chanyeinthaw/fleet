services:
  friday:
    container_name: friday
    image: fleet/friday:nightly.48
    build:
      context: ../..
      dockerfile: services/friday/image/Dockerfile
    restart: unless-stopped
    depends_on:
      docker-in-docker:
        condition: service_healthy
    networks: [default, docker-in-docker]
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      CPA_API_KEY: ${FRIDAY_CPA_API_KEY:?required by fnox}
      DISCORD_APPLICATION_ID: ${FRIDAY_DISCORD_APPLICATION_ID:?required by fnox}
      DISCORD_BOT_TOKEN: ${FRIDAY_DISCORD_BOT_TOKEN:?required by fnox}
      DISCORD_PUBLIC_KEY: ${FRIDAY_DISCORD_PUBLIC_KEY:?required by fnox}
      TAILSCALE_AUTH_KEY: ${FRIDAY_TAILSCALE_AUTH_KEY:?required by fnox}
      FRIDAY_UPDATE_CHANNEL: nightly
      FRIDAY_UPDATE_ON_START: "false"
      TAILSCALE_HOSTNAME: friday
    ports:
      - "127.0.0.1:4020:4020"
    volumes:
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/friday/home:/home/friday/.friday
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/friday/pi:/home/friday/.pi
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/friday/gh:/home/friday/.config/gh
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/friday/ssh:/home/friday/.ssh
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/friday/ssh-host:/var/lib/friday-ssh
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/friday/tailscale:/var/lib/tailscale
      - ${FLEET_SERVICES_DATA_DIR:?set by scripts/services}/friday/workspaces:/home/friday/workspaces
      - docker-in-docker-certs:/certs/client:ro
    healthcheck:
      test: [CMD, /usr/local/bin/friday-healthcheck]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
