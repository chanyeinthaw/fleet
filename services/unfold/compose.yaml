services:
  unfold:
    container_name: unfold
    image: ${UNFOLD_IMAGE:-ghcr.io/chanyeinthaw/unfold:v0.0.0-nightly.2}
    restart: unless-stopped
    env_file:
      - ${FLEET_SERVICES_DATA_DIR}/unfold/runtime.env
    environment:
      UNFOLD_HOST: 0.0.0.0
      UNFOLD_PORT: '3002'
      UNFOLD_DATABASE: /data/friday.sqlite
      UNFOLD_ORIGIN: https://unfold.si14.space
    ports:
      - 127.0.0.1:3003:3002
    volumes:
      - optmem-data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3002/health]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  unfold-tunnel:
    container_name: unfold-tunnel
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    env_file:
      - ${FLEET_SERVICES_DATA_DIR}/unfold/tunnel.env
    depends_on:
      unfold:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  optmem-data:
    external: true
    name: fleet-services_optmem-data
