[tools]
fnox = "1.35.3"

[env]
_.path = ["{{config_root}}/scripts/fnox-adapter"]
PASSWORD_STORE_DIR = "{{config_root}}/secrets"
FNOX_DAEMON = "false"

[tasks.tools]
description = "Install and activate Fleet's CLI versions"
run = [
  "mise install fnox",
  "mise use --global npm:@openai/codex@0.159.2 pi@0.85.1 claude@2.1.285 gopass@1.17.3",
  'gopass config mounts.path "{{config_root}}/secrets"',
  "gopass config core.autosync false",
  "gopass config core.autopush false",
]

[tasks.bootstrap]
description = "Install agent tools, dependencies, and configuration"
run = [
  "mise run tools",
  "pnpm --dir agents/pi install",
  "./scripts/link",
  "./scripts/check",
]

[tasks.link]
description = "Install or refresh agent configuration"
run = "./scripts/link"

[tasks.check]
description = "Validate Fleet configuration and installed links"
run = "./scripts/check"

[tasks."cpa:warm"]
description = "Unlock GPG if needed and cache the CPA key for this boot"
run = "./scripts/cpa-key warm"

[tasks.update]
description = "Refresh agent tools and configuration"
run = [
  "mise run tools",
  "pnpm --dir agents/pi install",
  "./scripts/link",
  "./scripts/check",
]

[tasks."services:up"]
description = "Start or reconcile Fleet's Compose services"
run = "./scripts/services up"

[tasks."services:down"]
description = "Stop Fleet's Compose services while preserving local data"
run = "./scripts/services down"

[tasks."services:restart"]
description = "Restart Fleet's existing Compose containers"
run = "./scripts/services restart"
