[tools]
python = "3.13.15"
fnox = "1.35.3"
stow = "2.4.1"

[env]
_.path = ["{{config_root}}/scripts/secrets/adapter"]
PASSWORD_STORE_DIR = "{{config_root}}/secrets"
FNOX_DAEMON = "on"

[tasks.tools]
description = "Install and activate Fleet's CLI versions"
run = [
  "./scripts/tools/register-stow",
  "mise install",
  "mise use --global npm:@openai/codex@0.160.0 pi@1.0.0 claude@2.1.287 gopass@1.17.3",
  'gopass config mounts.path "{{config_root}}/secrets"',
  "gopass config core.autosync false",
  "gopass config core.autopush false",
]

[tasks.bootstrap]
description = "Install agent tools, dependencies, and configuration"
run = [
  "mise run tools",
  "pnpm --dir agents/pi install",
  "./scripts/link",
  "./scripts/check",
  "./scripts/dotfiles/run",
]

[tasks.link]
description = "Install or refresh agent configuration"
run = "./scripts/link"

[tasks.check]
description = "Validate Fleet configuration and installed links"
run = "./scripts/check"

[tasks.secrets]
description = "Manage fnox secrets; use warm to cache every configured profile"
run = "./scripts/secrets/fnox"

[tasks.update]
description = "Refresh agent tools and configuration"
run = [
  "mise run tools",
  "pnpm --dir agents/pi install",
  "./scripts/link",
  "./scripts/check",
  "./scripts/dotfiles/run",
]

[tasks."services:up"]
description = "Start or reconcile Fleet's Compose services"
run = "./scripts/services/run up"

[tasks."services:down"]
description = "Stop Fleet's Compose services while preserving local data"
run = "./scripts/services/run down"

[tasks."services:restart"]
description = "Restart Fleet's existing Compose containers"
run = "./scripts/services/run restart"

[tasks."dotfiles:sync"]
description = "Encrypt the local dotfiles directory into Fleet’s secret store"
run = "./scripts/dotfiles/run sync"
